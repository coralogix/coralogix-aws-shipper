name: Cloudformation Template Sync

on:
  workflow_dispatch:
  # Only after a successful Publish. The template's CodeUri points at the
  # coralogix-serverless-repo artifacts for its version, so syncing before those exist
  # produces a template referencing objects that are not there yet. A push trigger on
  # README.md used to do exactly that: on the 1.4.16 release it opened the sync PR nine
  # minutes before Publish finished uploading the zips.
  workflow_run:
    workflows: ["Publish"]
    types:
      - completed
env:
  REPO_BUCKET_PREFIX: coralogix-serverless-repo
  REPO_PACKAGE_ZIP: coralogix-aws-shipper.zip
  CFN_INTEGRATION_DIR: aws-integrations/aws-shipper-lambda
  CLOUDFORMATION_REPO: coralogix/cloudformation-coralogix-aws


jobs:
  get-template:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: checkout coralogix-aws-shipper repository
        uses: actions/checkout@v7

      - name: get last commit_message
        id: commits
        run: |
          last_pr_name=$(curl -s -H "Authorization: Bearer ${{ secrets.GH_TOKEN }}" \
          "https://api.github.com/repos/coralogix/coralogix-aws-shipper/pulls?state=closed&base=master&sort=updated&direction=desc" \
          | jq -r '.[0].title')
          echo last_commit=$last_pr_name >> $GITHUB_OUTPUT

      - run: sudo snap install yq
        # Update the CodeUri property of all AWS::Serverless::Function resources using Yq
      - uses: actions/checkout@v7
      - name: update-template
        run: |
          set -xv

          # add CpuArch param
          yq -i '.Parameters.CpuArch |= {
              "Type": "String", 
              "AllowedValues": ["x86_64", "arm64"], 
              "Default": "arm64"
            } | .Resources.LambdaFunction.Properties.Architectures = [ {"Ref": "CpuArch"}  ]' ./template.yaml
          
          # add CpuArch Condition
          yq -i '.Conditions.CpuArchIsx8664 = {
            "Fn::Equals": [ 
                { "Ref": "CpuArch"}, 
                "x86_64" ] 
            }' ./template.yaml

          # update the CodeUri property of LambdaFunction resources
          # based on the CpuArch condition
          yq -i '.Resources.LambdaFunction.Properties.CodeUri |= {
              "Bucket": {"Fn::Sub": "coralogix-serverless-repo-${AWS::Region}"}, 
              "Key": {
                  "Fn::If": [
                      "CpuArchIsx8664", 
                      "coralogix-aws-shipper-x86-64.zip", 
                      "coralogix-aws-shipper.zip"
                  ]
              }
          }' template.yaml

          # set custom resource CodeUri
          yq -i '.Resources.CustomResourceFunction.Properties.CodeUri = {
              "Bucket": {"Fn::Sub": "coralogix-serverless-repo-${AWS::Region}"}, 
              "Key": "coralogix-aws-shipper-custom-resource.zip"
          }' template.yaml

          # sed -i '3a\#Created automatically from coralogix\/coralogix-aws-shipper' ./template.yaml
          # sed -i '4a\#Link to the repo: https:\/\/github.com\/coralogix\/coralogix-aws-shipper\/tree\/master/' ./template.yaml 
          sed -i '9a\ Created automatically from [coralogix-aws-shipper](https:\/\/github.com\/coralogix\/coralogix-aws-shipper) . To make a change to the template please go to the this [link](https:\/\/github.com\/coralogix\/coralogix-aws-shipper\/blob\/master\/template.yaml)' ./README.md          
          sed -i '10a\  ' ./README.md
          cat ./template.yaml       
          set +xv

      - name: read the template version
        id: version
        run: |
          set -euo pipefail
          v="$(yq -r '.Metadata."AWS::ServerlessRepo::Application".SemanticVersion' template.yaml)"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: store artifacts
        uses: actions/upload-artifact@v4
        with:
          name: store
          path: |
            ./template.yaml
            ./README.md
            ./CHANGELOG.md
    outputs:
      last_commit: ${{ steps.commits.outputs.last_commit }}
      version: ${{ steps.version.outputs.version }}


  sync-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: get-template
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      # Into a subdirectory: the PR body is written to the runner temp, and keeping the
      # target repo out of the workspace root avoids clobbering anything else.
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.CLOUDFORMATION_REPO }}
          token: ${{ secrets.GH_TOKEN }}
          path: target

      - run: mkdir .tmp

      - name: download template
        uses: actions/download-artifact@v4
        with:
          name: store
          path: .tmp

      - name: stage the synced files
        id: changes
        run: |
          set -euo pipefail
          dest="target/${{ env.CFN_INTEGRATION_DIR }}"
          mkdir -p "$dest"
          mv -v ./.tmp/* "$dest/"

          git -C target add "${{ env.CFN_INTEGRATION_DIR }}"
          if git -C target diff --cached --quiet; then
            echo "no changes to sync"
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            git -C target --no-pager diff --cached --stat
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi

      # A PR, not a direct push. Org-wide rulesets on public repos require changes to
      # reach the default branch through a pull request ("branch-one-approval-public"),
      # so the previous direct commit is rejected. Modelled on the sync in
      # coralogix/telemetry-shippers (.github/workflows/sync-fleet-manager.yml).
      # One branch and one PR per released version, so nothing is ever reused: no
      # remote-tracking ref to fetch, no lease, and the PR title always matches its
      # contents. Both triggers fire for a single release (the README push, then
      # Publish); the second finds the PR already open and stops.
      - name: open the sync PR
        if: steps.changes.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TITLE: ${{ needs.get-template.outputs.last_commit }}
          VERSION: ${{ needs.get-template.outputs.version }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_MENTION: ${{ vars.SLACK_MENTION || '@team-ido' }}
        run: |
          set -euo pipefail
          branch="bot/sync-aws-shipper-$VERSION"

          existing="$(gh pr list -R "${{ env.CLOUDFORMATION_REPO }}" --head "$branch" \
                        --state all --json number,state \
                        --jq '.[0] | select(.) | "#\(.number) \(.state)"')"
          if [ -n "$existing" ]; then
            echo "already synced for $VERSION: PR $existing"
            exit 0
          fi

          git -C target config user.name  "coralogix-concourse"
          git -C target config user.email "coralogix-concourse@users.noreply.github.com"
          git -C target checkout -b "$branch"
          git -C target commit -m "$TITLE"
          # Force: the branch is per-version and bot-owned, so the only way it already
          # exists is a previous run that pushed and then failed before opening the PR.
          git -C target push --force -u origin "$branch"

          body="$RUNNER_TEMP/pr-body.md"
          {
            echo "Automated template sync from [coralogix-aws-shipper](https://github.com/coralogix/coralogix-aws-shipper), release **$VERSION**."
            echo
            echo "Generated by \`.github/workflows/sync.yml\` after a successful release."
            echo "\`CodeUri\` is rewritten to the published \`coralogix-serverless-repo-<region>\`"
            echo "artifacts and the \`CpuArch\` parameter is added, so do not edit these files"
            echo "here - change \`template.yaml\` in the shipper repo instead."
            echo
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > "$body"

          pr="$(gh pr create -R "${{ env.CLOUDFORMATION_REPO }}" \
                  --base master --head "$branch" \
                  --title "$TITLE" --body-file "$body")"
          echo "opened $pr"

          # Arm auto-merge so the PR lands the moment someone approves. Needs "Allow
          # auto-merge" on the target repo; the org ruleset's one approval cannot be
          # satisfied by a bot, so a human still approves. Never fail the sync for this.
          gh pr merge "$pr" -R "${{ env.CLOUDFORMATION_REPO }}" --auto --squash \
            || echo "auto-merge not armed; PR is open for manual merge"

          # The PR needs a human, and nobody is watching that repo. Failure here must not
          # fail a sync that has already done its job.
          if [ -n "${SLACK_WEBHOOK_URL:-}" ]; then
            # link_names makes Slack resolve the @handle into a real mention so the group
            # is notified. If it ever renders as plain text, replace SLACK_MENTION with
            # the user-group id form, <!subteam^S0123ABCD>.
            jq -n --arg text "$SLACK_MENTION shipper *$VERSION* released - CloudFormation template sync needs merge: $pr" \
              '{text: $text, link_names: 1}' \
              | curl -sf -X POST -H 'Content-type: application/json' --data @- "$SLACK_WEBHOOK_URL" \
              || echo "slack notification failed; continuing"
          else
            echo "SLACK_WEBHOOK_URL not set; skipping notification"
          fi
