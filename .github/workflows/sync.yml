name: Cloudformation Template Sync

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Publish"]
    types:
      - completed
  push:
    branches:
      - master
    paths:
      - 'README.md'
env:
  REPO_BUCKET_PREFIX: coralogix-serverless-repo
  REPO_PACKAGE_ZIP: coralogix-aws-shipper.zip
  CFN_INTEGRATION_DIR: aws-integrations/aws-shipper-lambda
  CLOUDFORMATION_REPO: coralogix/cloudformation-coralogix-aws


jobs:
  get-template:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: ${{ github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: checkout coralogix-aws-shipper repository
        uses: actions/checkout@v7

      - name: get last commit_message
        id: commits
        run: |
          last_pr_name=$(curl -s -H "Authorization: Bearer ${{ secrets.GH_TOKEN }}" \
          "https://api.github.com/repos/coralogix/coralogix-aws-shipper/pulls?state=closed&base=master&sort=updated&direction=desc" \
          | jq -r '.[0].title')
          echo last_commit=$last_pr_name >> $GITHUB_OUTPUT

      - run: sudo snap install yq
        # Update the CodeUri property of all AWS::Serverless::Function resources using Yq
      - uses: actions/checkout@v7
      - name: update-template
        run: |
          set -xv

          # add CpuArch param
          yq -i '.Parameters.CpuArch |= {
              "Type": "String", 
              "AllowedValues": ["x86_64", "arm64"], 
              "Default": "arm64"
            } | .Resources.LambdaFunction.Properties.Architectures = [ {"Ref": "CpuArch"}  ]' ./template.yaml
          
          # add CpuArch Condition
          yq -i '.Conditions.CpuArchIsx8664 = {
            "Fn::Equals": [ 
                { "Ref": "CpuArch"}, 
                "x86_64" ] 
            }' ./template.yaml

          # update the CodeUri property of LambdaFunction resources
          # based on the CpuArch condition
          yq -i '.Resources.LambdaFunction.Properties.CodeUri |= {
              "Bucket": {"Fn::Sub": "coralogix-serverless-repo-${AWS::Region}"}, 
              "Key": {
                  "Fn::If": [
                      "CpuArchIsx8664", 
                      "coralogix-aws-shipper-x86-64.zip", 
                      "coralogix-aws-shipper.zip"
                  ]
              }
          }' template.yaml

          # set custom resource CodeUri
          yq -i '.Resources.CustomResourceFunction.Properties.CodeUri = {
              "Bucket": {"Fn::Sub": "coralogix-serverless-repo-${AWS::Region}"}, 
              "Key": "coralogix-aws-shipper-custom-resource.zip"
          }' template.yaml

          # sed -i '3a\#Created automatically from coralogix\/coralogix-aws-shipper' ./template.yaml
          # sed -i '4a\#Link to the repo: https:\/\/github.com\/coralogix\/coralogix-aws-shipper\/tree\/master/' ./template.yaml 
          sed -i '9a\ Created automatically from [coralogix-aws-shipper](https:\/\/github.com\/coralogix\/coralogix-aws-shipper) . To make a change to the template please go to the this [link](https:\/\/github.com\/coralogix\/coralogix-aws-shipper\/blob\/master\/template.yaml)' ./README.md          
          sed -i '10a\  ' ./README.md
          cat ./template.yaml       
          set +xv

      - name: store artifacts
        uses: actions/upload-artifact@v4
        with:
          name: store
          path: |
            ./template.yaml
            ./README.md
            ./CHANGELOG.md
    outputs:
      last_commit: ${{ steps.commits.outputs.last_commit }}


  sync-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: get-template
    if: ${{ github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    steps:
      # Into a subdirectory: the PR body is written to the runner temp, and keeping the
      # target repo out of the workspace root avoids clobbering anything else.
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.CLOUDFORMATION_REPO }}
          token: ${{ secrets.GH_TOKEN }}
          path: target

      - run: mkdir .tmp

      - name: download template
        uses: actions/download-artifact@v4
        with:
          name: store
          path: .tmp

      - name: stage the synced files
        id: changes
        run: |
          set -euo pipefail
          dest="target/${{ env.CFN_INTEGRATION_DIR }}"
          mkdir -p "$dest"
          mv -v ./.tmp/* "$dest/"

          git -C target add "${{ env.CFN_INTEGRATION_DIR }}"
          if git -C target diff --cached --quiet; then
            echo "no changes to sync"
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            git -C target --no-pager diff --cached --stat
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi

      # A PR, not a direct push. Org-wide rulesets on public repos require changes to
      # reach the default branch through a pull request ("branch-one-approval-public"),
      # so the previous direct commit is rejected. Modelled on the sync in
      # coralogix/telemetry-shippers (.github/workflows/sync-fleet-manager.yml).
      - name: open or update the sync PR
        if: steps.changes.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TITLE: ${{ needs.get-template.outputs.last_commit }}
        run: |
          set -euo pipefail
          branch="bot/sync-aws-shipper-template"

          git -C target config user.name  "coralogix-concourse"
          git -C target config user.email "coralogix-concourse@users.noreply.github.com"
          git -C target checkout -b "$branch"
          git -C target commit -m "$TITLE"
          # A fixed branch reused every release, so force-with-lease rather than a
          # new branch each time - avoids accumulating stale sync branches.
          git -C target push --force-with-lease -u origin "$branch"
          head_sha="$(git -C target rev-parse HEAD)"

          pr="$(gh pr list -R "${{ env.CLOUDFORMATION_REPO }}" --head "$branch" \
                  --state open --json number --jq '.[0].number')"
          if [ -z "$pr" ]; then
            body="$RUNNER_TEMP/pr-body.md"
            {
              echo "Automated template sync from [coralogix-aws-shipper](https://github.com/coralogix/coralogix-aws-shipper)."
              echo
              echo "Generated by \`.github/workflows/sync.yml\` after a successful release."
              echo "\`CodeUri\` is rewritten to the published \`coralogix-serverless-repo-<region>\`"
              echo "artifacts and the \`CpuArch\` parameter is added, so do not edit these files"
              echo "here - change \`template.yaml\` in the shipper repo instead."
              echo
              echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            } > "$body"
            pr="$(gh pr create -R "${{ env.CLOUDFORMATION_REPO }}" \
                    --base master --head "$branch" \
                    --title "$TITLE" --body-file "$body")"
            echo "opened $pr"
          else
            echo "updated existing PR #$pr"
          fi

          # Best effort: the target repo has "Allow auto-merge" disabled, and the
          # org ruleset requires one approval that no bot can supply. Arming it means
          # the PR merges the moment a human approves, and a failure here must not
          # fail the sync - the PR is the deliverable.
          gh pr merge "$pr" -R "${{ env.CLOUDFORMATION_REPO }}" \
            --auto --squash --match-head-commit "$head_sha" \
            || echo "auto-merge not armed (needs 'Allow auto-merge' on the target repo); PR is open for manual merge"
