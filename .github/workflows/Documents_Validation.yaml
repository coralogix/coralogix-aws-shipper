name: Documents Validation
# the action will validate all of the .md files in the repo 
on:
  pull_request:
    types: [opened, synchronize]
    branches: [master]
    paths:
      - ".markdownlint-cli2.yaml"
      - "*.md"
jobs:
  check-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    name: Check Documentation formatting and links
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    # No Python step: both checks below are npm tools. The job used to set up
    # Python 3.9 and then only run `pip install --upgrade pip`, which broke when
    # ubuntu-latest moved to 26.04 and stopped shipping 3.9.
    - name: Install dependencies
      run: npm install -g markdown-link-check

    - name: Check Markdown style
      run: |
        npx --yes markdownlint-cli2
    
    - name: Check documentation formatting and links
      run: |
        find . -regex ".*\.md" -exec markdown-link-check -c .markdownlinkcheckconfig.json {} \;
