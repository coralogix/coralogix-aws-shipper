name: Publish Release Candidate to Staging

on:
  push:
    branches:
      - dev
  
  workflow_dispatch: 

env:
  AWS_DEFAULT_REGION: eu-west-1
  AWS_SERVERLESS_BUCKET: coralogix-serverless-repo-staging
  AWS_S3_PREFIX: coralogix-aws-shipper-staging

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        target:
          - arm64
          - x86-64
    steps:
      - name: TMP dump oidc claims
        run: |
          set +e
          curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" > /tmp/resp.json 2>&1
          python3 -c "
          import base64, json
          t = json.load(open('/tmp/resp.json')).get('value','')
          p = t.split('.')[1]; p += '=' * (-len(p) % 4)
          c = json.loads(base64.urlsafe_b64decode(p))
          print(json.dumps({k: c.get(k) for k in ['sub','aud','job_workflow_ref','repository','ref','workflow']}, indent=1))
          "
          TOKEN=$(python3 -c "import json; print(json.load(open('/tmp/resp.json'))['value'])")
          echo "=== jwt header ==="
          python3 -c "
          import base64, json
          t = open('/tmp/resp.json').read()
          t = json.loads(t)['value']
          h = t.split('.')[0]; h += '=' * (-len(h) % 4)
          print(json.dumps(json.loads(base64.urlsafe_b64decode(h)), indent=1))
          "
          echo "=== jwks kids ==="
          curl -sS https://token.actions.githubusercontent.com/.well-known/jwks | python3 -c "
          import json, sys, base64
          jwks = json.load(sys.stdin)
          for k in jwks.get('keys', []):
              kid = k.get('kid','')
              print(kid, k.get('kty'), k.get('alg'))
          "
          echo "=== bisect: subonly / subaud (ido) / subaud (ccs) / staging ==="
          AWS_DEFAULT_REGION=eu-west-1 aws sts assume-role-with-web-identity \
            --role-arn arn:aws:iam::035955823196:role/tmp-oidc-bisect-subonly \
            --role-session-name bisect1 --web-identity-token "$TOKEN" >/dev/null 2>/tmp/e1 && echo "1 subonly-ido: OK" || echo "1 subonly-ido: FAIL $(cat /tmp/e1 | head -1)"
          AWS_DEFAULT_REGION=eu-west-1 aws sts assume-role-with-web-identity \
            --role-arn arn:aws:iam::035955823196:role/tmp-oidc-bisect-subaud \
            --role-session-name bisect2 --web-identity-token "$TOKEN" >/dev/null 2>/tmp/e2 && echo "2 subaud-ido: OK" || echo "2 subaud-ido: FAIL $(cat /tmp/e2 | head -1)"
          AWS_DEFAULT_REGION=eu-central-1 aws sts assume-role-with-web-identity \
            --role-arn arn:aws:iam::597078901540:role/tmp-oidc-bisect-subaud-ccs \
            --role-session-name bisect3 --web-identity-token "$TOKEN" >/dev/null 2>/tmp/e3 && echo "3 subaud-ccs: OK" || echo "3 subaud-ccs: FAIL $(cat /tmp/e3 | head -1)"
          AWS_DEFAULT_REGION=eu-west-1 aws sts assume-role-with-web-identity \
            --role-arn arn:aws:iam::035955823196:role/github-actions-coralogix-aws-shipper-publish-staging \
            --role-session-name bisect4 --web-identity-token "$TOKEN" >/dev/null 2>/tmp/e4 && echo "4 staging-ido: OK" || echo "4 staging-ido: FAIL $(cat /tmp/e4 | head -1)"

      - name: checkout
        uses: actions/checkout@v4
        with:
          ref: dev

      - uses: aws-actions/configure-aws-credentials@v2
        with:
          audience: sts.amazonaws.com
          role-to-assume: arn:aws:iam::035955823196:role/github-actions-coralogix-aws-shipper-publish-staging
          role-session-name: coralogix-aws-shipper-rc-${{ github.run_id }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      - uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          cache: 'pip' # caching pip dependencies
      - run: pip3 install cargo-lambda

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: start ssh agent for rust private dependencies
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: sam build
        env:
          RUST_ARCH: ${{ matrix.target }}
        run: sam build

      - name: package
        run: |
          sam package \
            --s3-bucket ${{ env.AWS_SERVERLESS_BUCKET }} \
            --s3-prefix '${{ env.AWS_S3_PREFIX }}/${{ matrix.target }}' \
            --output-template-file packaged.yaml

          # change author field
          yq -i '.Metadata."AWS::ServerlessRepo::Application".Author = "coralogix-cdo-dev"' packaged.yaml 

      - name: s3upload-x86-64-build
        if: ${{ matrix.target == 'x86-64' }}
        run: |
          aws s3 cp \
            $(yq -r '.Resources | to_entries | .[] | select(.key == "LambdaLayer" or .key == "LambdaFunctionDefault") | .value.Properties | to_entries | .[] | select(.key == "ContentUri" or .key == "CodeUri") | .value' packaged.yaml) \
            s3://${{ env.AWS_SERVERLESS_BUCKET }}/coralogix-aws-shipper-${{ matrix.target }}.zip

      - name: store-arm64-package
        uses: actions/upload-artifact@v4
        # only store the arm64 package as this is the
        # only one that will be published to SAR
        if: ${{ matrix.target == 'arm64' }}
        with:
          name: packaged.yaml
          path: packaged.yaml

  publish:
    name: publish-rc
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' || success() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          audience: sts.amazonaws.com
          role-to-assume: arn:aws:iam::035955823196:role/github-actions-coralogix-aws-shipper-publish-staging
          role-session-name: coralogix-aws-shipper-rc-${{ github.run_id }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      - name: download
        uses: actions/download-artifact@v4
        with:
          name: packaged.yaml

      - name: publish
        run: sam publish --template packaged.yaml

      - name: store
        run: |
          aws s3 cp \
            $(yq -r '.Resources | to_entries | .[] | select(.key == "LambdaLayer" or .key == "LambdaFunctionDefault") | .value.Properties | to_entries | .[] | select(.key == "ContentUri" or .key == "CodeUri") | .value' packaged.yaml) \
            s3://${{ env.AWS_SERVERLESS_BUCKET }}/coralogix-aws-shipper.zip

          # upload custom resource
          aws s3 cp \
            $(yq -r '.Resources | to_entries | .[] | select(.key == "CustomResourceFunction") | .value.Properties | to_entries | .[] | select(.key == "CodeUri") | .value' packaged.yaml) \
            s3://${{ env.AWS_SERVERLESS_BUCKET }}/coralogix-aws-shipper-custom-resource.zip

