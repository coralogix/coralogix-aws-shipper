name: build check

# Dry-run build gate: when a PR is opened against master, compile the FIPS-enabled
# Lambda inside an Amazon Linux 2023 builder (native compiler, glibc 2.34) for BOTH
# architectures, to catch broken / incompatible dependencies before merge.
# No publish, no SAR, no S3. The only persisted output is a short-lived GitHub
# Actions artifact for the private shipper-e2e suite to verify before use.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches:
      - master
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "requirements.txt"
      - "Makefile"
      # Dependabot PRs for this file require a Dependabot secret named
      # SSH_PRIVATE_KEY so the FIPS build can resolve private SDK git deps.
      - "requirements.txt"
      - "template.yaml"
      - "ci/**"
      - "vendor/**"
      # Both jobs here install the pinned toolchain and compile inside AL2023, and the
      # GovCloud container reads the channel out of this file. The test workflow builds
      # on the host only, so without this an incompatible toolchain bump merges without
      # either FIPS build running.
      - "rust-toolchain.toml"
      - "tests/govcloud_distrust.rs"
      - "tests/data/distrusted/**"
      - ".github/workflows/build-check.yaml"

jobs:
  fips-build:
    name: fips build (${{ matrix.arch }}, provided.al2023)
    # Allow skipping with the existing skip-test label, or the build-specific
    # skip-build-check label if it is added to the repo later.
    if: "!contains(github.event.pull_request.labels.*.name, 'skip-test') && !contains(github.event.pull_request.labels.*.name, 'skip-build-check')"
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            artifact_arch: arm64
            runner: ubuntu-24.04-arm
          - arch: amd64
            artifact_arch: x86-64
            runner: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: verify private dependency SSH key is available
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::error::SSH_PRIVATE_KEY is required for the FIPS build because Cargo resolves private SDK git dependencies."
            echo "::error::For Dependabot PRs, configure SSH_PRIVATE_KEY as a repository or organization Dependabot secret with access to coralogix-sdk-rust."
            exit 1
          fi

      - name: verify checkout sha
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"

      - name: start ssh agent for rust private dependencies
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: set up docker buildx
        uses: docker/setup-buildx-action@v3

      - name: build AL2023 builder image (cached, native ${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ci/Dockerfile.builder
          tags: fips-al2023-builder:latest
          load: true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: cache cargo registry
        uses: actions/cache@v6
        with:
          path: ~/.cargo-registry
          key: cargo-registry-${{ matrix.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ matrix.arch }}-

      - name: build FIPS lambda (dry run, no publish)
        run: |
          mkdir -p ~/.cargo-registry
          docker run --rm \
            -v "$PWD":/work -w /work \
            -v ~/.cargo-registry:/usr/local/cargo/registry \
            -v "$SSH_AUTH_SOCK":/ssh-agent -e SSH_AUTH_SOCK=/ssh-agent \
            -e LAMBDA_ARCH=${{ matrix.arch }} \
            fips-al2023-builder:latest \
            bash /work/ci/fips-build.sh

      - name: artifact summary
        run: |
          file .build-artifacts/bootstrap
          ls -la .build-artifacts/

      - name: package shipper e2e artifact
        env:
          ARTIFACT_ARCH: ${{ matrix.artifact_arch }}
          BUILD_ARCH: ${{ matrix.arch }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          WORKFLOW_PATH: .github/workflows/build-check.yaml
          GITHUB_RUN_ID_VALUE: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT_VALUE: ${{ github.run_attempt }}
        run: |
          set -euo pipefail

          artifact_name="coralogix-aws-shipper-${ARTIFACT_ARCH}.zip"
          metadata_name="coralogix-aws-shipper-${ARTIFACT_ARCH}.metadata.json"
          output_dir="${RUNNER_TEMP}/shipper-e2e-artifacts"

          test -f .build-artifacts/bootstrap
          rm -rf "${output_dir}"
          mkdir -p "${output_dir}"

          zip -j "${output_dir}/${artifact_name}" .build-artifacts/bootstrap
          artifact_digest="sha256:$(sha256sum "${output_dir}/${artifact_name}" | awk '{print $1}')"
          artifact_size="$(wc -c < "${output_dir}/${artifact_name}" | tr -d '[:space:]')"

          python3 - <<PY
          import json
          from pathlib import Path

          metadata = {
              "artifact_name": "${artifact_name}",
              "artifact_digest": "${artifact_digest}",
              "artifact_size": int("${artifact_size}"),
              "architecture": "${ARTIFACT_ARCH}",
              "build_arch": "${BUILD_ARCH}",
              "source_sha": "${SOURCE_SHA}",
              "workflow_path": "${WORKFLOW_PATH}",
              "github_run_id": "${GITHUB_RUN_ID_VALUE}",
              "github_run_attempt": "${GITHUB_RUN_ATTEMPT_VALUE}",
              "zip_root": "bootstrap",
          }
          Path("${output_dir}/${metadata_name}").write_text(
              json.dumps(metadata, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          cat "${output_dir}/${metadata_name}"

      - name: upload shipper e2e artifact
        uses: actions/upload-artifact@v4
        with:
          name: coralogix-aws-shipper-${{ matrix.artifact_arch }}.zip
          path: |
            ${{ runner.temp }}/shipper-e2e-artifacts/coralogix-aws-shipper-${{ matrix.artifact_arch }}.zip
            ${{ runner.temp }}/shipper-e2e-artifacts/coralogix-aws-shipper-${{ matrix.artifact_arch }}.metadata.json
          if-no-files-found: error
          retention-days: 3

  # The GovCloud build is a different dependency set on purpose -- aws-lc-rs 1.17 and a
  # patched rustls-webpki, to keep the NIST-validated AWS-LC FIPS v3 module. The job
  # above says nothing about it, so verify it here with the same inputs that build the
  # artifact, natively on both shipped architectures.
  govcloud-verify:
    name: govcloud verify (${{ matrix.arch }}, provided.al2023)
    if: "!contains(github.event.pull_request.labels.*.name, 'skip-test') && !contains(github.event.pull_request.labels.*.name, 'skip-build-check')"
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - arch: amd64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: verify private dependency SSH key is available
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::error::SSH_PRIVATE_KEY is required: Cargo resolves private SDK git dependencies."
            exit 1
          fi

      - name: start ssh agent for rust private dependencies
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: set up docker buildx
        uses: docker/setup-buildx-action@v3

      - name: build AL2023 builder image (cached, native ${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ci/Dockerfile.builder
          tags: fips-al2023-builder:latest
          load: true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      # Downloads only -- crate sources and git checkouts, never compiled output.
      #
      # Compilation stays cold on purpose. The guard must hold where every unit is
      # fresh rather than replayed, and caching the target directories was measured at
      # ~1.9 GB per architecture against a 10 GB repository-wide limit that is already
      # half spent, most of it the builder image's own buildx cache. Evicting that to
      # replay compilation would likely cost more than it saves.
      - name: restore cargo download cache
        uses: actions/cache@v4
        with:
          path: |
            .ci-cache/registry
            .ci-cache/git
          key: govcloud-downloads-${{ matrix.arch }}-${{ hashFiles('ci/govcloud/Cargo.lock', 'ci/govcloud/webpki-harness.lock', 'Cargo.toml') }}
          restore-keys: govcloud-downloads-${{ matrix.arch }}-

      # One container for all three stages: the builder image installs the pinned
      # toolchain at run time, so separate containers would each repeat that, and the
      # GovCloud inputs have to be in place for all of them.
      - name: verify, build and test the GovCloud configuration (cold cache)
        env:
          TARGET: ${{ matrix.target }}
          LAMBDA_ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p .cargo .ci-cache/registry .ci-cache/git
          cp ci/govcloud/config.toml .cargo/config.toml
          cp ci/govcloud/Cargo.lock Cargo.lock
          docker run --rm \
            -v "$PWD":/work -w /work \
            -v "$PWD/.ci-cache/registry":/usr/local/cargo/registry \
            -v "$PWD/.ci-cache/git":/usr/local/cargo/git \
            -v "$SSH_AUTH_SOCK":/ssh-agent -e SSH_AUTH_SOCK=/ssh-agent \
            -e TARGET="$TARGET" -e LAMBDA_ARCH="$LAMBDA_ARCH" \
            fips-al2023-builder:latest \
            bash -c '
              set -euo pipefail
              . ci/govcloud/_container-setup.sh

              echo "::group::build inputs"
              ci/govcloud/verify-build-inputs.sh
              echo "::endgroup::"

              # cargo check does not link, and the vendored suite builds library tests,
              # so neither produces the artifact that ships. fips-build.sh does, and
              # already asserts the architecture and that glibc stays within the
              # provided.al2023 runtime -- run against the GovCloud inputs here rather
              # than the commercial ones the fips-build job uses.
              echo "::group::linked GovCloud lambda"
              ci/fips-build.sh
              echo "::endgroup::"

              echo "::group::vendored rustls-webpki regression suite"
              ci/govcloud/test-vendored-webpki.sh
              echo "::endgroup::"

              # Runtime evidence that the shipped client enforces the distrust, as
              # opposed to merely containing code that would. --include-ignored because
              # the client cases are #[ignore] by default: they are meaningless without
              # the GovCloud inputs the guard above has just checked.
              echo "::group::runtime distrust tests"
              listed=$(cargo test --release --locked --target "$TARGET" \
                --test govcloud_distrust -- --include-ignored --list)
              # A renamed or removed case would otherwise be a silent zero-test pass.
              for name in fixture_still_carries_a_distrusted_key \
                          rest_sdk_control_succeeds_and_is_observed \
                          rest_sdk_rejects_distrusted_chain_before_sending_anything \
                          aws_sdk_control_succeeds_and_is_observed \
                          aws_sdk_rejects_distrusted_chain_before_sending_anything \
                          otlp_control_succeeds_and_is_observed \
                          otlp_rejects_distrusted_chain_before_sending_anything; do
                printf "%s" "$listed" | grep -qF "$name: test" || {
                  echo "::error::$name not found in tests/govcloud_distrust.rs" >&2
                  exit 1
                }
              done

              cargo test --release --locked --target "$TARGET" \
                --test govcloud_distrust -- --include-ignored --test-threads=1 --nocapture
              echo "::endgroup::"
            '

      # The container runs as root, so the downloads come back root-owned and the
      # cache action cannot read them. Runs on failure too, so a run that fails late
      # still leaves its downloads for the next one.
      - name: hand the download cache back to the runner
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" .ci-cache

      - name: GovCloud artifact summary
        run: |
          file .build-artifacts/bootstrap
          ls -la .build-artifacts/
