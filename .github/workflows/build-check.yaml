name: build check

# Dry-run build gate: when a PR is opened against master, compile the FIPS-enabled
# Lambda inside an Amazon Linux 2023 builder (native compiler, glibc 2.34) for BOTH
# architectures, to catch broken / incompatible dependencies before merge.
# No publish, no SAR, no S3. The only persisted output is a short-lived GitHub
# Actions artifact for the private shipper-e2e suite to verify before use.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches:
      - master
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "requirements.txt"
      - "Makefile"
      # Dependabot PRs for this file require a Dependabot secret named
      # SSH_PRIVATE_KEY so the FIPS build can resolve private SDK git deps.
      - "requirements.txt"
      - "template.yaml"
      - "ci/**"
      - ".github/workflows/build-check.yaml"

jobs:
  fips-build:
    name: fips build (${{ matrix.arch }}, provided.al2023)
    # Allow skipping with the existing skip-test label, or the build-specific
    # skip-build-check label if it is added to the repo later.
    if: "!contains(github.event.pull_request.labels.*.name, 'skip-test') && !contains(github.event.pull_request.labels.*.name, 'skip-build-check')"
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            artifact_arch: arm64
            runner: ubuntu-24.04-arm
          - arch: amd64
            artifact_arch: x86-64
            runner: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: verify private dependency SSH key is available
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::error::SSH_PRIVATE_KEY is required for the FIPS build because Cargo resolves private SDK git dependencies."
            echo "::error::For Dependabot PRs, configure SSH_PRIVATE_KEY as a repository or organization Dependabot secret with access to coralogix-sdk-rust."
            exit 1
          fi

      - name: verify checkout sha
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"

      - name: start ssh agent for rust private dependencies
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: set up docker buildx
        uses: docker/setup-buildx-action@v3

      - name: build AL2023 builder image (cached, native ${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ci/Dockerfile.builder
          tags: fips-al2023-builder:latest
          load: true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo-registry
          key: cargo-registry-${{ matrix.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ matrix.arch }}-

      - name: build FIPS lambda (dry run, no publish)
        run: |
          mkdir -p ~/.cargo-registry
          docker run --rm \
            -v "$PWD":/work -w /work \
            -v ~/.cargo-registry:/usr/local/cargo/registry \
            -v "$SSH_AUTH_SOCK":/ssh-agent -e SSH_AUTH_SOCK=/ssh-agent \
            -e LAMBDA_ARCH=${{ matrix.arch }} \
            fips-al2023-builder:latest \
            bash /work/ci/fips-build.sh

      - name: artifact summary
        run: |
          file .build-artifacts/bootstrap
          ls -la .build-artifacts/

      - name: package shipper e2e artifact
        env:
          ARTIFACT_ARCH: ${{ matrix.artifact_arch }}
          BUILD_ARCH: ${{ matrix.arch }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          WORKFLOW_PATH: .github/workflows/build-check.yaml
          GITHUB_RUN_ID_VALUE: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT_VALUE: ${{ github.run_attempt }}
        run: |
          set -euo pipefail

          artifact_name="coralogix-aws-shipper-${ARTIFACT_ARCH}.zip"
          metadata_name="coralogix-aws-shipper-${ARTIFACT_ARCH}.metadata.json"
          output_dir="${RUNNER_TEMP}/shipper-e2e-artifacts"

          test -f .build-artifacts/bootstrap
          rm -rf "${output_dir}"
          mkdir -p "${output_dir}"

          zip -j "${output_dir}/${artifact_name}" .build-artifacts/bootstrap
          artifact_digest="sha256:$(sha256sum "${output_dir}/${artifact_name}" | awk '{print $1}')"
          artifact_size="$(wc -c < "${output_dir}/${artifact_name}" | tr -d '[:space:]')"

          python3 - <<PY
          import json
          from pathlib import Path

          metadata = {
              "artifact_name": "${artifact_name}",
              "artifact_digest": "${artifact_digest}",
              "artifact_size": int("${artifact_size}"),
              "architecture": "${ARTIFACT_ARCH}",
              "build_arch": "${BUILD_ARCH}",
              "source_sha": "${SOURCE_SHA}",
              "workflow_path": "${WORKFLOW_PATH}",
              "github_run_id": "${GITHUB_RUN_ID_VALUE}",
              "github_run_attempt": "${GITHUB_RUN_ATTEMPT_VALUE}",
              "zip_root": "bootstrap",
          }
          Path("${output_dir}/${metadata_name}").write_text(
              json.dumps(metadata, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          cat "${output_dir}/${metadata_name}"

      - name: upload shipper e2e artifact
        uses: actions/upload-artifact@v4
        with:
          name: coralogix-aws-shipper-${{ matrix.artifact_arch }}.zip
          path: |
            ${{ runner.temp }}/shipper-e2e-artifacts/coralogix-aws-shipper-${{ matrix.artifact_arch }}.zip
            ${{ runner.temp }}/shipper-e2e-artifacts/coralogix-aws-shipper-${{ matrix.artifact_arch }}.metadata.json
          if-no-files-found: error
          retention-days: 3
