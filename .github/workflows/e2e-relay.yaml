name: AWS Shipper E2E Relay

on:
  workflow_run:
    workflows: [build check, AWS Shipper E2E PR Events]
    types: [requested, in_progress, completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Public PR workflow run to reconcile
        required: true
        type: string
      source_attempt:
        description: Exact attempt of that public run
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: e2e-relay-${{ github.event.workflow_run.id || inputs.source_run_id }}-${{ github.event.workflow_run.run_attempt || inputs.source_attempt }}
  cancel-in-progress: false

jobs:
  stage:
    name: Verify and stage PR build
    if: github.ref == 'refs/heads/master' && (vars.SHIPPER_E2E_PR_ENABLED == 'true' || vars.SHIPPER_E2E_PR_ALLOWED_PRS != '')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      id-token: write
    outputs:
      notify: ${{ steps.prepare.outputs.notify }}
    env:
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.source_run_id }}
      SOURCE_ATTEMPT: ${{ github.event.workflow_run.run_attempt || inputs.source_attempt }}
      SHIPPER_E2E_PR_ENABLED: ${{ vars.SHIPPER_E2E_PR_ENABLED || 'false' }}
      SHIPPER_E2E_PR_ALLOWED_PRS: ${{ vars.SHIPPER_E2E_PR_ALLOWED_PRS }}
    steps:
      # This is an operator-reviewed implementation pin, never a PR/dispatch ref.
      - name: Validate reviewed relay revision
        env:
          IMPLEMENTATION_SHA: ${{ vars.SHIPPER_E2E_PR_IMPLEMENTATION_SHA || github.sha }}
          DEFAULT_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os, re
          assert re.fullmatch(r'[0-9a-f]{40}', os.environ['IMPLEMENTATION_SHA']), 'Invalid relay implementation SHA'
          if os.environ['IMPLEMENTATION_SHA'] != os.environ['DEFAULT_SHA']:
              assert os.environ['SHIPPER_E2E_PR_ENABLED'] != 'true', 'Custom revision is canary-only'
              assert os.environ['SHIPPER_E2E_PR_ALLOWED_PRS'], 'Custom revision requires a canary PR'
          PY
      - uses: actions/checkout@v7
        with:
          ref: ${{ vars.SHIPPER_E2E_PR_IMPLEMENTATION_SHA || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Download and verify exact source attempt
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: python ci/e2e_relay.py prepare --directory "$RUNNER_TEMP/pr-e2e-relay"
      - name: Validate staging configuration
        if: steps.prepare.outputs.needs_upload == 'true'
        env:
          ROLE: ${{ vars.SHIPPER_E2E_RC_WRITER_ROLE_ARN }}
          ACCOUNT: ${{ vars.SHIPPER_E2E_AWS_ACCOUNT_ID }}
          REGION: ${{ vars.SHIPPER_E2E_AWS_REGION }}
          BUCKET: ${{ vars.SHIPPER_E2E_GATE_BUCKET }}
        run: |
          python3 - <<'PY'
          import os, re
          assert re.fullmatch(r'[0-9]{12}', os.environ['ACCOUNT']), 'Expected AWS account is required'
          assert re.fullmatch(r'arn:aws(?:-us-gov|-cn)?:iam::' + os.environ['ACCOUNT'] + r':role/[A-Za-z0-9+=,.@_/-]+', os.environ['ROLE']), 'Invalid staging role/account'
          assert os.environ['REGION'] and os.environ['BUCKET'], 'Staging bucket and region are required'
          PY
      - uses: aws-actions/configure-aws-credentials@v6
        if: steps.prepare.outputs.needs_upload == 'true'
        with:
          role-to-assume: ${{ vars.SHIPPER_E2E_RC_WRITER_ROLE_ARN }}
          aws-region: ${{ vars.SHIPPER_E2E_AWS_REGION }}
          allowed-account-ids: ${{ vars.SHIPPER_E2E_AWS_ACCOUNT_ID }}
          mask-aws-account-id: true
      - name: Upload immutable PR bundle
        if: steps.prepare.outputs.needs_upload == 'true'
        env:
          SHIPPER_E2E_GATE_BUCKET: ${{ vars.SHIPPER_E2E_GATE_BUCKET }}
        run: |
          python -m pip install 'boto3>=1.34,<2'
          python ci/e2e_relay.py upload --directory "$RUNNER_TEMP/pr-e2e-relay"

  notify:
    name: Notify private E2E controller
    needs: stage
    if: always() && needs.stage.outputs.notify == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No PR archives or AWS/CX credentials enter this job.
      - name: Mint private-repository dispatch token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_PRIVATE_KEY }}
          owner: coralogix
          repositories: internal-aws-shipper-e2e
          permission-contents: write
      - name: Reconcile current PR heads
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          gh api --method POST repos/coralogix/internal-aws-shipper-e2e/dispatches \
            -f event_type=shipper-pr-e2e
