[graph]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
]

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
  { id = "RUSTSEC-2025-0012", reason = "Transitive through coralogix-sdk-rust backoff; no safe upgrade is available in this repository." },
  { id = "RUSTSEC-2024-0384", reason = "Transitive through backoff; no safe upgrade is available in this repository." },
  { id = "RUSTSEC-2024-0388", reason = "Transitive through starlark; requires upstream dependency replacement." },
  { id = "RUSTSEC-2024-0436", reason = "Transitive through starlark; requires upstream dependency replacement." },
  { id = "RUSTSEC-2025-0057", reason = "Transitive through starlark_map; requires upstream dependency replacement." },
  { id = "RUSTSEC-2026-0346", reason = "Fixed only in rustls >= 0.23.46, which requires aws-lc-rs ^1.18 and so the uncertified AWS-LC FIPS v4 module; see RUSTSEC-2026-0285 below for why this repository stays on v3. This one does apply to us: the shipper is a TLS client built with rustls feature prefer-post-quantum. The impact is bounded at loss of post-quantum confidentiality on resumed sessions against an active network attacker (harvest-now-decrypt-later). There is no key compromise, no authentication bypass, and classical TLS confidentiality and integrity are unaffected. Revisit once AWS-LC FIPS v4 is certified." },
  { id = "RUSTSEC-2026-0348", reason = "Fixed only in rustls >= 0.23.46; see RUSTSEC-2026-0285 for the FIPS constraint. Not reachable here: the pre-authentication 1 GiB allocation is in RFC 8879 brotli certificate decompression, and no brotli certificate-compression feature is enabled in this dependency tree." },
  { id = "RUSTSEC-2026-0349", reason = "Fixed only in rustls >= 0.23.46; see RUSTSEC-2026-0285 for the FIPS constraint. Not reachable here: the leak requires the application to Debug-format client session values, which this codebase never does." },
  { id = "RUSTSEC-2026-0285", reason = "The fix (rustls >= 0.23.45) requires aws-lc-rs ^1.18, which replaces the NIST-validated AWS-LC FIPS v3 module (certificates #5314 and #5298) with v4, submitted to NIST but not yet certified. GovCloud deployments run ENABLE_AWS_FIPS=true and the README claims FIPS 140-3 compliance, so taking the upgrade would break that claim. The advisory is a TLS 1.3 conformance bug: the handshake transcript stays authenticated, so a peer can only send in plaintext what should have been encrypted; it cannot alter or complete a handshake. Revisit once AWS-LC FIPS v4 is certified." },
]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "0BSD",
  "BSL-1.0",
  "CC0-1.0",
  "MIT-0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
  "OpenSSL",
  "CDLA-Permissive-2.0",
]

[[licenses.clarify]]
crate = "cx_sdk_core"
expression = "MIT"
license-files = [
  { path = "../LICENSE", hash = 0x9e7164c8 },
]

[[licenses.clarify]]
crate = "cx_sdk_rest_logs"
expression = "MIT"
license-files = [
  { path = "../LICENSE", hash = 0x9e7164c8 },
]

[[licenses.clarify]]
crate = "cx_sdk_otlp"
expression = "MIT"
license-files = [
  { path = "../LICENSE", hash = 0x9e7164c8 },
]

[bans]
multiple-versions = "warn"
deny = [
  { crate = "aws-lc-rs:>=1.18", reason = "aws-lc-rs 1.18 moves from the NIST-validated AWS-LC FIPS v3 module (certificates #5314 and #5298) to v4, which is submitted but not yet certified. GovCloud runs ENABLE_AWS_FIPS=true and the README claims FIPS 140-3, so this must stay on v3 until v4 is certified." },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
  "ssh://git@github.com/coralogix/coralogix-sdk-rust",
]
