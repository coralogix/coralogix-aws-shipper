receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  transform/byoc:
    error_mode: propagate
    log_statements:
      - set(log.attributes["gateway.enriched"], true)
  batch: {}

exporters:
  debug:
    verbosity: detailed

service:
  pipelines:
    logs:
      receivers: [otlp]
      processors: [transform/byoc, batch]
      exporters: [debug]
